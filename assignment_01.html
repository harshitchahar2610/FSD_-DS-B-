<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <style>
        .shop {
            border: 2px solid black;
            padding: 20px;
            width: 800px;
            margin: auto;
        }
        h1 {
            text-align: center;
        }
        .products {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .product {
            border: 2px solid black;
            padding: 20px;
            text-align: center;
        }
        .product img {
            width: 120px;
            height: 120px;
            object-fit: cover;
        }
        button {
            display: block;
            margin: 25px auto;
            padding: 10px 25px;
            font-size: 16px;
            cursor: pointer;
        }
        #output {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="shop">
    <h1>Online Shop</h1>
    <div class="products">
        <div class="product">
            <img src="https://imgs.search.brave.com/12DYQQsBmUHHR_TY1_cCkneJsplEi5F-SJVXqhP8Sqg/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9jZG4u/Y3JlYXRlLnZpc3Rh/LmNvbS9hcGkvbWVk/aWEvc21hbGwvMjM1/ODY1Mzcvc3RvY2st/cGhvdG8tY3VwLW9m/LXRlYQ" alt="Tea">
            <h3>Tea</h3>
            <p>₹120</p>
        </div>

        <div class="product">
            <img src="https://imgs.search.brave.com/OyJsEVXYDqUIwTJQ7oaXm5UyQvQ4hAnx3nq7bLZwzfc/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9zdDUu/ZGVwb3NpdHBob3Rv/cy5jb20vNjgyNTgy/NTAvNzA1MjAvaS80/NTAvZGVwb3NpdHBo/b3Rvc183MDUyMDcx/MjAtc3RvY2stcGhv/dG8tcm9hc3RlZC1j/b2ZmZWUtYmVhbnMt/d2hpdGUtY3VwLmpw/Zw" alt="Coffee">
            <h3>Coffee</h3>
            <p>₹500</p>
        </div>

        <div class="product">
            <img src="https://imgs.search.brave.com/3jQPZ5SpFnNfkyvW6Zv_kpRaBbywHcX8Hg-hQ9D_f4U/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMudmVjdGVlenku/Y29tL3N5c3RlbS9y/ZXNvdXJjZXMvdGh1/bWJuYWlscy8wMzcv/OTg4Lzk0My9zbWFs/bC9zdGVhbWVkLWJh/c21hdGktcmljZS1p/bi10aGUtYm93bC1w/aG90by5qcGc" alt="Rice">
            <h3>Rice</h3>
            <p>₹600</p>
        </div>

        <div class="product">
            <img src="https://imgs.search.brave.com/JfoDrxssnih3U-dm8AbyAhCCojEkqkv2FshMllnTc5Q/rs:fit:500:0:1:0/g:ce/aHR0cHM6Ly9pbWcu/bWFnbmlmaWMuY29t/L3ByZW1pdW0tcGhv/dG8vcmVmaW5lZC1z/dWdhci1jb2xvcmVk/LWJhY2tncm91bmQt/ZGlhYmV0ZXMtY29u/Y2VwdC1leGNlc3Mt/c3VnYXJfNDQxOTIz/LTI1MC5qcGc_c2Vt/dD1haXNfdGVzdF9i/Jnc9NzQwJnE9ODA" alt="Sugar">
            <h3>Sugar</h3>
            <p>₹700</p>
        </div>

    </div>
    <button onclick="buyItem()">Buy Item</button>
    <div id="output"></div>
</div>


<script>

    const online_shop = {
        tea: 120,
        coffee: 500,
        rice: 600,
        sugar: 700
    };

    function buyItem() {
        var z = prompt("Enter item name you want to buy");
        var y = prompt("Enter the quantity");
        z = z.toLowerCase();
        y = Number(y);
        for (let x in online_shop) {
            if (x == z) {
                var total = online_shop[x] * y;
                document.getElementById("output").innerHTML =
                    "You bought " + y + " " + z +
                    "<br>Total price = ₹" + total;
                return;
            }
        }
        document.getElementById("output").innerHTML =
            "Item not available!";
    }

</script>

</body>
</html>
